<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/forgotPassword.css">
    <title>forgotpassword</title>
</head>
<body>
    <section>
        <div class="title">Reset</div>
        <div class="title">Password</div>
        <p>enter your email that you have registered</p>
        <form action="/forgotpassword/" method="get" >
            <div id='inputs'>
                <input id='email' name="email" type='email' required>
            </div>
            {% if error %}
                <div class="text-danger">{{error}}</div>
            {% endif %}
            <button type="submit">Submit</button>
        </form>
        
    </section>
    <script src="/static/js/forgotpassword.js"></script>
</body>
</html>
