<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Kanit&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


  <link rel="stylesheet" href="/static/css/font-awesome.css">
  <link rel="stylesheet" href="/static/css/mine.css">
</head>

<body>
  <div class="grid">
    <div class="container">
      <div class="row">
        <div class="col-md-offset-1 col-md-2">
          <div class="grid-line"></div>
        </div>
        <div class="col-md-2">
          <div class="grid-line"></div>
        </div>
        <div class="col-md-2">
          <div class="grid-line"></div>
        </div>
        <div class="col-md-2">
          <div class="grid-line"></div>
        </div>
        <div class="col-md-2">
          <div class="grid-line" style="margin-right:-30px;border-right:1px solid #ccc"></div>
        </div>
      </div>
    </div>
  </div>


  <!-- <div id="background"></div> -->
  <canvas class="background" id="background"></canvas>

  <main class="main">
    <header>
      <div class="container">
        <div class="title">
          <div class="row">
            <div class="col-md-offset-1 col-md-6">
              <h1 id="back">Request</h1>
            </div>
          </div>
        </div>
        <div class="subtitle">
          <div class="row">
            <div class="col-md-offset-1 col-md-2">
              <a class="dam" href="{% url 'mine' %}" >
                <h3>Mine</h3>
              </a>
            </div>
            <div class="col-md-2">
              <a class="dam" href="{% url 'compare' %}">
                <h3>Compare</h3>
              </a>
            </div>
            <div class="col-md-2">
              <a class="dam" href="{% url 'track' %}">
                <h3>Track</h3>
              </a>
            </div>
            <div class="col-md-2">
              <a class="dam" href="{% url 'request' %}">
                <h3>Request</h3>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="container mt-5">

      {% if re %}
        <div class="container text-center">
          <h1 class="text-success fs-1">thank you </h1>
        </div>
      {% else %}
        <form action="{% url 'request' %}" class="needs-validation" novalidate method="post">
          {% csrf_token %}
          <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">@</span>
            <input type="text" class="form-control is-invalid" name="userid" id="REuser" required>
          </div>

          <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1">@</span>
            <input type="email" class="form-control is-invalid" name="useremail" placeholder="email" id="REuser" required>
          </div>

          <div class="form-floating">
            <select class="form-select is-invalid" name="retype" id="floatingSelect" required >
              <option value="request" selected>request</option>
              <option value="complain">complain</option>
            </select>
            <label for="floatingSelect">type</label>
          </div>

          <div class="container mt-3">

            <div class="form-floating mt-3" id="reques" >
              <textarea class="form-control is-invalid" name="titelre" required placeholder="Leave a comment here" id="floatingTextarea"></textarea>
              <label for="floatingTextarea" id="labbel">request</label>
            </div>
          </div>

          <div class="form-floating mt-3">
            <textarea class="form-control is-invalid" name="recomment" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
            <label for="floatingTextarea2">Comments</label>
          </div>
          <div class="text-center mt-3">
            <button class="btn btn-outline-success" id="subBtn" type="submit">Submit</button>
          </div>
        </form>
      {% endif %}

      
    </div>
  </main>



  <script src="/static/js/jquery-1.11.0.min.js"></script>
  <script src="/static/js/bootstrap.min.js"></script>
  <script src="/static/js/user/request.js"></script>

</body>

</html>
