<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/passwordOTP.css">
    <title>verify</title>
</head>
<body>
    <section>
        <div class="title">OTP</div>
        <div class="title">Verification Code</div>
        <p>We have sent a verification code to your {{email}}</p>
        <form action="/forgotpassword/verify/" method="get" >
            {% csrf_token %}
            <div id='inputs'>
                <input id='input1' type='text' name="ot1" pattern="{0-9}" maxLength="1" required>
                <input id='input2' type='text' name="ot2" pattern="{0-9}" maxLength="1" required>
                <input id='input3' type='text' name="ot3" pattern="{0-9}" maxLength="1" required>
                <input id='input4' type='text' name="ot4" pattern="{0-9}" maxLength="1" required>
            </div>
            {% if error %}
                <div class="text-danger">
                    {{error}}
                </div>
            {% endif %}
            <button type="submit">Submit</button>
        </form>
        
    </section>
    <script src="/static/js/otp.js"></script>
</body>
</html>
